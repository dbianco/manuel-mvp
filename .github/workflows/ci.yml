# CI: unit tests + lint on every PR against main, and on every push to main (T021).
#
# Deliberately scoped to JVM unit tests (testDebugUnitTest) and Android Lint (lintDebug) only --
# not instrumented tests (MainScreenTest.kt, T019), which need a real device/emulator and are out
# of scope for this workflow.
#
# Not runnable/verifiable in this sandbox (no local GitHub Actions runner set up here -- see
# t021-ci-spec.md's Clarifications): written against well-established, standard GitHub Actions
# patterns for Android projects, and will be validated for real on the first live run.
#
# Deliberately does NOT install an NDK: testDebugUnitTest/lintDebug compile JVM bytecode and don't
# package native .so libraries, so they should not need externalNativeBuildDebug's toolchain. If a
# live run proves this wrong, add an explicit NDK install step naming whatever version the error
# names.
name: CI

# Quoted "on" (rather than bare `on:`) to avoid YAML 1.1's boolean coercion of the unquoted word
# "on" to `true` under a strict parser (PyYAML's safe_load, yamllint, etc.) -- GitHub's own backend
# special-cases the bare form and both are equivalent to GitHub Actions, but the quoted form
# round-trips correctly through standard YAML tooling too.
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (with submodules for llama.cpp/whisper.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore
